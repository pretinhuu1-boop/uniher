server {
    listen 80;
    listen [::]:80;
    server_name uniher.com.br www.uniher.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uniher.com.br www.uniher.com.br;

    ssl_certificate /etc/letsencrypt/live/uniher.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uniher.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location /_next/static/ {
        alias /var/www/uniher/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        root /var/www/uniher-preview/current;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        alias /var/www/uniher-preview/current/assets/;
        add_header Cache-Control "public, max-age=300";
    }

    location = /nova {
        return 301 /nova/;
    }

    location ^~ /nova/ {
        root /var/www/uniher-preview/current;
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=60";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
